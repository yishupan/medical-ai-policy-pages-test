name: Policy radar pages test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - index.html
      - data/**
      - scripts/**
      - .github/workflows/policy-radar-pages.yml
  push:
    branches: [main]
    paths:
      - index.html
      - data/policies.json
      - data/sources.json
      - scripts/**
      - tests/**
      - .github/workflows/policy-radar-pages.yml
  schedule:
    - cron: '30 23 * * *'
    - cron: '40 4 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  guard-schedule:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Skip duplicate fallback schedule runs
        id: decide
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName !== 'schedule') {
              core.setOutput('should_run', 'true');
              return;
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '.github/workflows/policy-radar-pages.yml',
              event: 'schedule',
              per_page: 100
            });

            const currentRunId = Number(process.env.GITHUB_RUN_ID);
            const previousSuccess = runs
              .filter((run) => run.id !== currentRunId && run.conclusion === 'success')
              .sort((a, b) => Date.parse(b.run_started_at ?? b.created_at) - Date.parse(a.run_started_at ?? a.created_at))[0];

            if (!previousSuccess) {
              core.info('No earlier successful scheduled run found. Proceeding.');
              core.setOutput('should_run', 'true');
              return;
            }

            const previousStartedAt = Date.parse(previousSuccess.run_started_at ?? previousSuccess.created_at);
            const hoursSincePreviousSuccess = (Date.now() - previousStartedAt) / 3_600_000;

            if (hoursSincePreviousSuccess < 8) {
              core.info(`Skipping fallback scheduled run because run #${previousSuccess.run_number} succeeded ${hoursSincePreviousSuccess.toFixed(2)} hours ago.`);
              core.setOutput('should_run', 'false');
              return;
            }

            core.info(`Previous successful scheduled run is ${hoursSincePreviousSuccess.toFixed(2)} hours old. Proceeding.`);
            core.setOutput('should_run', 'true');

  validate:
    needs: guard-schedule
    if: needs.guard-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test monitoring parser
        run: python3 -m unittest discover -s tests -v
      - name: Test public data boundary
        run: ruby tests/test_public_data.rb
      - name: Validate required files
        run: test -s index.html && test -s data/policies.json && test -s data/sources.json && test -s data/candidates.json

  build-and-deploy:
    needs: guard-schedule
    if: github.event_name != 'pull_request' && needs.guard-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test monitoring parser
        run: python3 -m unittest discover -s tests -v
      - name: Test public data boundary
        run: ruby tests/test_public_data.rb
      - name: Fetch official monitoring sources
        run: python3 scripts/monitor_sources.py
      - name: Commit changed candidate facts
        run: |
          if git diff --quiet -- data/candidates.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json
          git commit -m "data: refresh monitored policy candidates"
          git push
      - name: Generate run status
        run: node scripts/build-run.mjs
      - name: Prepare public-only site
        run: |
          mkdir -p site/data
          cp index.html site/index.html
          cp data/policies.json data/run.json site/data/
          test ! -e site/policies
      - uses: actions/configure-pages@v6
      # Keep the Pages artifact explicit so the deploy step consumes the packaged site tarball.
      - name: Package GitHub Pages artifact
        run: |
          tar --dereference --hard-dereference -cvf github-pages.tar --directory site .
          gzip -f github-pages.tar
      - uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: github-pages.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
