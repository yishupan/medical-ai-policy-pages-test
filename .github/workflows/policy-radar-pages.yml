name: Policy radar pages test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - index.html
      - data/**
      - scripts/**
      - .github/workflows/policy-radar-pages.yml
  push:
    branches: [main]
    paths:
      - index.html
      - data/**
      - scripts/**
      - .github/workflows/policy-radar-pages.yml
  schedule:
    - cron: '30 23 * * 0-4'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate run status
        run: node scripts/build-run.mjs
      - name: Validate required files
        run: test -s index.html && test -s data/policies.json && test -s data/run.json

  build-and-deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate run status
        run: node scripts/build-run.mjs
      - name: Prepare public-only site
        run: |
          mkdir -p site/data
          cp index.html site/index.html
          cp data/policies.json data/run.json site/data/
          test ! -e site/policies
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
