name: Policy radar pages test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - index.html
      - data/candidates.json
      - data/candidate_status.json
      - data/candidate_review.json
      - data/**
      - pending_markdown/**
      - scripts/**
      - .github/workflows/policy-radar-pages.yml
  push:
    branches: [main]
    paths:
      - index.html
      - data/policies.json
      - data/sources.json
      - data/candidates.json
      - data/candidate_status.json
      - data/candidate_review.json
      - pending_markdown/**
      - scripts/**
      - tests/**
      - .github/workflows/policy-radar-pages.yml
  schedule:
    - cron: '30 23 * * *'
    - cron: '40 4 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  guard-schedule:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Skip duplicate fallback schedule runs
        id: decide
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName !== 'schedule') {
              core.setOutput('should_run', 'true');
              return;
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '.github/workflows/policy-radar-pages.yml',
              event: 'schedule',
              per_page: 100
            });

            const currentRunId = Number(process.env.GITHUB_RUN_ID);
            const previousSuccess = runs
              .filter((run) => run.id !== currentRunId && run.conclusion === 'success')
              .sort((a, b) => Date.parse(b.run_started_at ?? b.created_at) - Date.parse(a.run_started_at ?? a.created_at))[0];

            if (!previousSuccess) {
              core.info('No earlier successful scheduled run found. Proceeding.');
              core.setOutput('should_run', 'true');
              return;
            }

            const previousStartedAt = Date.parse(previousSuccess.run_started_at ?? previousSuccess.created_at);
            const hoursSincePreviousSuccess = (Date.now() - previousStartedAt) / 3_600_000;

            if (hoursSincePreviousSuccess < 8) {
              core.info(`Skipping fallback scheduled run because run #${previousSuccess.run_number} succeeded ${hoursSincePreviousSuccess.toFixed(2)} hours ago.`);
              core.setOutput('should_run', 'false');
              return;
            }

            core.info(`Previous successful scheduled run is ${hoursSincePreviousSuccess.toFixed(2)} hours old. Proceeding.`);
            core.setOutput('should_run', 'true');

  validate:
    needs: guard-schedule
    if: needs.guard-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sync candidate review artifacts
        run: python3 scripts/sync_candidate_review.py
      - name: Test monitoring parser
        run: python3 -m unittest discover -s tests -v
      - name: Test public data boundary
        run: ruby tests/test_public_data.rb
      - name: Validate required files
        run: |
          test -s index.html
          test -s data/policies.json
          test -s data/sources.json
          test -s data/candidates.json
          test -s data/candidate_status.json
          test -s data/candidate_review.json
          test -d pending_markdown
      - name: Validate generated candidate review artifacts are committed
        run: git diff --exit-code -- data/candidate_status.json data/candidate_review.json pending_markdown

  build-and-deploy:
    needs: guard-schedule
    if: github.event_name != 'pull_request' && needs.guard-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Detect whether source monitoring is needed
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          needs_monitoring=true
          changed_files=""

          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            needs_monitoring=false

            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                index.html|tests/*|.github/workflows/policy-radar-pages.yml)
                  ;;
                *)
                  needs_monitoring=true
                  break
                  ;;
              esac
            done <<< "$changed_files"
          fi

          echo "needs_monitoring=$needs_monitoring" >> "$GITHUB_OUTPUT"
          echo "Changed files under current push:"
          if [ -n "$changed_files" ]; then
            printf '%s\n' "$changed_files"
          else
            echo "(not applicable for this event)"
          fi
          echo "needs_monitoring=$needs_monitoring"
      - name: Test monitoring parser
        run: python3 -m unittest discover -s tests -v
      - name: Test public data boundary
        run: ruby tests/test_public_data.rb
      - name: Install browser runtime for JS-protected sources
        if: steps.scope.outputs.needs_monitoring == 'true'
        run: |
          python3 -m pip install --disable-pip-version-check "playwright>=1.55,<2"
          python3 -m playwright install --with-deps chromium
      - name: Fetch official monitoring sources
        if: steps.scope.outputs.needs_monitoring == 'true'
        run: python3 scripts/monitor_sources.py
      - name: Sync candidate review artifacts
        if: steps.scope.outputs.needs_monitoring == 'true'
        run: python3 scripts/sync_candidate_review.py
      - name: Commit changed monitored artifacts
        if: steps.scope.outputs.needs_monitoring == 'true'
        run: |
          if git diff --quiet -- data/candidates.json data/candidate_status.json data/candidate_review.json pending_markdown; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json data/candidate_status.json data/candidate_review.json pending_markdown
          git commit -m "data: refresh monitored policy candidates"
          git push
      - name: Generate run status
        run: node scripts/build-run.mjs
      - name: Prepare public-only site
        run: |
          mkdir -p site
          cp index.html site/index.html
          test -s site/data/policies.json
          test -s site/data/candidate_review.json
          test -s site/data/run.json
          test ! -e site/policies
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
