<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="医疗AI政策公开事实目录，展示政策基本信息、重要原文与公开可复核的官方解读。">
  <title>医疗AI政策目录</title>
  <style>
    :root { color-scheme: light; --ink: #172126; --muted: #66747b; --line: #d8e0e3; --paper: #fff; --wash: #f3f6f5; --navy: #12313d; --teal: #0d7568; --blue: #176b95; --focus: #e6f3f0; --alert: #b42318; --alert-wash: #fff1ef; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--wash); color: var(--ink); font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; letter-spacing: 0; }
    header { background: var(--navy); color: #fff; border-bottom: 4px solid var(--teal); }
    .header-inner, main, footer { width: min(1240px, calc(100% - 40px)); margin: 0 auto; }
    .header-inner { padding: 26px 0 23px; }
    .eyebrow { color: #95d6cc; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    h1 { margin: 4px 0 3px; font-size: 28px; line-height: 1.25; font-weight: 680; }
    header p { margin: 0; color: #cfdddf; }
    main { padding: 22px 0 36px; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); background: var(--paper); }
    .metric { min-height: 92px; padding: 17px 19px; border-right: 1px solid var(--line); }
    .metric:last-child { border-right: 0; }
    .metric strong { display: block; font-size: 27px; line-height: 1.15; font-variant-numeric: tabular-nums; }
    .metric span { color: var(--muted); }
    .controls { margin-top: 16px; padding: 15px; border: 1px solid var(--line); background: var(--paper); }
    .mode-switch { display: inline-flex; align-items: center; gap: 0; margin-bottom: 12px; padding: 3px; border: 1px solid #c8d2d6; border-radius: 7px; background: #f7faf9; }
    .mode-btn { min-width: 108px; height: 34px; border: 0; border-radius: 5px; background: transparent; color: #445861; font-weight: 700; }
    .mode-btn:hover { background: #edf5f3; border-color: transparent; }
    .mode-btn.active { background: #ffffff; color: var(--navy); box-shadow: inset 0 0 0 1px #9fcac1; }
    .controls.candidate-mode .filter-only-formal { opacity: 0.55; }
    .controls.candidate-mode .filter-only-formal select { background: #f6f8f8; color: #7a8a90; }
    .control-grid { display: grid; grid-template-columns: minmax(260px, 2fr) repeat(2, minmax(170px, 1fr)) auto; gap: 10px; }
    input, select, button { min-width: 0; height: 40px; border: 1px solid #c8d2d6; border-radius: 5px; background: #fff; color: var(--ink); padding: 0 11px; font: inherit; }
    input:focus, select:focus, button:focus-visible { outline: 3px solid #b9ded7; outline-offset: 1px; border-color: var(--teal); }
    button { cursor: pointer; font-weight: 600; }
    button:hover { background: var(--focus); border-color: #8bbeb6; }
    .quick { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
    .quick span { color: var(--muted); margin-right: 2px; }
    .quick button { height: 30px; padding: 0 9px; color: #33515b; background: #f8faf9; }
    .statusline { display: flex; justify-content: space-between; gap: 16px; margin: 17px 0 9px; color: var(--muted); }
    .statusline strong { color: var(--ink); }
    .list-wrap, .candidate-panel { border: 1px solid var(--line); background: var(--paper); }
    .policy-list { display: grid; gap: 14px; padding: 14px; }
    .policy-card { border: 1px solid #dfe7ea; background: #fbfdfd; padding: 17px 18px 18px; }
    .policy-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .policy-text { min-width: 0; }
    .policy-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
    .new-badge { display: inline-block; padding: 2px 7px; border: 1px solid #f3b1aa; border-radius: 999px; color: var(--alert); background: var(--alert-wash); font-size: 11px; font-weight: 700; white-space: nowrap; }
    .policy-id { display: inline-block; padding: 2px 7px; border: 1px solid #c9d9de; border-radius: 4px; color: #3e5a64; background: #f6f9fa; font-size: 12px; white-space: nowrap; }
    .title-main { font-size: 16px; line-height: 1.5; font-weight: 650; }
    .toggle-btn { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; min-width: 96px; width: fit-content; height: 32px; padding: 0 12px; white-space: nowrap; line-height: 1; background: #f8faf9; }
    .policy-grid { display: grid; grid-template-columns: 2.2fr 1.5fr 1fr 0.8fr 1fr 0.8fr; gap: 14px 16px; margin-top: 16px; padding-top: 14px; border-top: 1px solid #e8edef; align-items: start; }
    .field { min-width: 0; }
    .field-label { margin: 0 0 5px; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .field-value { margin: 0; color: var(--ink); font-size: 14px; line-height: 1.55; font-weight: 560; overflow-wrap: anywhere; word-break: break-word; }
    .field-value.subtle { font-weight: 500; color: #31444b; }
    .source-link { font-weight: 600; }
    .section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 18px 18px 0; }
    .section-head h2 { margin: 0; font-size: 18px; line-height: 1.35; }
    .section-head p { margin: 6px 0 0; color: var(--muted); }
    .section-actions, .candidate-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .action-link { display: inline-flex; align-items: center; justify-content: center; min-height: 34px; padding: 0 12px; border: 1px solid #c8d2d6; border-radius: 5px; background: #fff; color: var(--ink); font-weight: 600; text-decoration: none; }
    .action-link:hover { background: var(--focus); border-color: #8bbeb6; }
    .action-link.primary { background: #f4fbf8; border-color: #9fcac1; }
    .candidate-panel { margin-top: 18px; }
    .candidate-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 16px 18px 0; }
    .candidate-list { display: grid; gap: 12px; padding: 16px 14px 14px; }
    .candidate-card { border: 1px solid #dfe7ea; background: #fbfdfd; padding: 16px; }
    .candidate-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .candidate-title { margin: 6px 0 0; font-size: 16px; line-height: 1.5; font-weight: 650; }
    .status-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .status-pending { color: #8a4b00; background: #fff3e0; border: 1px solid #f3c176; }
    .status-confirmed { color: #0b5d49; background: #ecf9f3; border: 1px solid #9fceb9; }
    .status-rejected { color: #8a2133; background: #fff1f4; border: 1px solid #f3b1bf; }
    .candidate-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 16px; margin-top: 16px; padding-top: 14px; border-top: 1px solid #e8edef; }
    .candidate-note { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #d6e0e3; color: #40555d; }
    body.modal-open { overflow: hidden; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 30; overflow-y: auto; padding: 56px 24px 24px; background: rgba(18, 49, 61, 0.42); }
    .detail-modal { position: relative; width: min(920px, 100%); max-height: none; margin: 0 auto; overflow: auto; border: 1px solid #d4dde0; background: var(--paper); box-shadow: 0 24px 60px rgba(12, 32, 39, 0.18); }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding: 22px 24px 18px; border-bottom: 1px solid #e8edef; background: #fbfdfd; }
    .modal-title { margin: 8px 0 0; font-size: 22px; line-height: 1.35; font-weight: 680; }
    .modal-close { width: 36px; min-width: 36px; height: 36px; padding: 0; font-size: 24px; line-height: 1; font-weight: 500; }
    .modal-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 18px 24px 0; }
    .summary-card { padding: 12px 13px; border: 1px solid #e1e8eb; background: #f8faf9; }
    .summary-card strong { display: block; margin-bottom: 4px; font-size: 12px; color: var(--muted); }
    .summary-card span { display: block; color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }
    .details-panel { padding: 18px 24px 24px; }
    .detail-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, 1fr); gap: 18px; }
    .detail-block h2 { margin: 0 0 8px; font-size: 14px; line-height: 1.4; font-weight: 650; }
    .detail-block p { margin: 0; color: #31444b; }
    .quotes-list { margin: 0; padding-left: 18px; color: #31444b; }
    .quotes-list li + li { margin-top: 8px; }
    .detail-link { display: inline-block; margin-top: 8px; }
    .detail-actions { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 12px; }
    a { color: var(--blue); text-underline-offset: 2px; }
    .empty { padding: 44px 20px; text-align: center; color: var(--muted); }
    footer { padding: 0 0 28px; color: var(--muted); font-size: 12px; }
    footer p { margin: 4px 0; }
    @media (max-width: 940px) {
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric:nth-child(2) { border-right: 0; }
      .metric:nth-child(-n + 2) { border-bottom: 1px solid var(--line); }
      .control-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .control-grid input { grid-column: 1 / -1; }
      .mode-switch { display: flex; width: 100%; }
      .mode-btn { flex: 1 1 0; min-width: 0; }
      .policy-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .candidate-stats, .candidate-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .modal-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .detail-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .header-inner, main, footer { width: min(100% - 24px, 1240px); }
      .header-inner { padding: 20px 0 18px; }
      h1 { font-size: 23px; }
      .metric { min-height: 82px; padding: 14px; }
      .metric strong { font-size: 23px; }
      .control-grid { grid-template-columns: 1fr; }
      .control-grid input { grid-column: auto; }
      .statusline { display: block; }
      .statusline > span { display: block; margin-top: 3px; }
      .policy-list { padding: 10px; gap: 10px; }
      .policy-card { padding: 14px; }
      .policy-head { display: block; }
      .toggle-btn { margin-top: 10px; min-width: 104px; }
      .policy-grid { grid-template-columns: 1fr; gap: 12px; }
      .section-head, .candidate-top { display: block; }
      .section-actions { margin-top: 10px; }
      .candidate-stats, .candidate-grid { grid-template-columns: 1fr; }
      .modal-backdrop { padding: 16px 12px 12px; }
      .modal-head, .details-panel { padding-left: 16px; padding-right: 16px; }
      .modal-summary { grid-template-columns: 1fr; padding-left: 16px; padding-right: 16px; }
      .modal-title { font-size: 19px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="eyebrow">Medical AI Policy Directory</div>
      <h1>医疗AI政策目录</h1>
      <p>公开事实版，展示政策基本信息、重要原文与公开可复核的官方解读</p>
    </div>
  </header>
  <main>
    <section class="metrics" aria-label="政策概况">
      <div class="metric"><strong id="policyCount">-</strong><span>政策文件</span></div>
      <div class="metric"><strong id="nationalCount">-</strong><span>全国及国家层面</span></div>
      <div class="metric"><strong id="regionalCount">-</strong><span>地方政策</span></div>
      <div class="metric"><strong id="healthCount">-</strong><span>卫生健康部门相关</span></div>
    </section>
    <section class="controls" aria-label="政策筛选">
      <div class="mode-switch" role="tablist" aria-label="政策列表切换">
        <button id="modeFormal" class="mode-btn active" type="button" role="tab" aria-selected="true">正式政策</button>
        <button id="modeCandidate" class="mode-btn" type="button" role="tab" aria-selected="false">候选政策</button>
      </div>
      <div class="control-grid">
        <input id="search" type="search" placeholder="搜索编号、政策名称、部门、文号或地区" aria-label="搜索政策">
        <div class="filter-only-formal">
          <select id="category" aria-label="按主题分类筛选"><option value="">全部主题</option></select>
        </div>
        <div class="filter-only-formal">
          <select id="region" aria-label="按地区筛选"><option value="">全部地区</option></select>
        </div>
        <button id="reset" type="button">重置</button>
      </div>
      <div class="quick" aria-label="常用关键词">
        <span>常用检索</span>
        <button type="button" data-keyword="医疗AI">医疗AI</button>
        <button type="button" data-keyword="医学影像">医学影像</button>
        <button type="button" data-keyword="检查检验">检查检验</button>
        <button type="button" data-keyword="医疗服务价格">医疗服务价格</button>
        <button type="button" data-keyword="数据安全">数据安全</button>
      </div>
    </section>
    <div class="statusline">
      <strong>检索结果：<span id="resultCount">-</span> 项</strong>
      <span id="lastRun">正在读取公开数据...</span>
    </div>
    <section class="list-wrap" aria-label="政策文件列表">
      <div id="cards" class="policy-list"></div>
      <div id="empty" class="empty" hidden>没有匹配记录</div>
    </section>
    <section id="candidatePanel" class="candidate-panel" aria-label="候选政策巡检区" hidden>
      <div class="section-head">
        <div>
          <h2>候选政策巡检区</h2>
          <p id="candidateGuide">自动巡检发现、但尚未正式入库的候选条目。可直接去 GitHub 修改状态，并继续补写草稿 Markdown。</p>
        </div>
        <div id="candidateActions" class="section-actions"></div>
      </div>
      <div id="candidateStats" class="candidate-stats"></div>
      <div id="candidateCards" class="candidate-list"></div>
      <div id="candidateEmpty" class="empty" hidden>当前没有待人工核验的候选政策。</div>
    </section>
  </main>
  <footer>
    <p>本页仅展示公开事实、原文摘录与公开可复核的官方解读；正式引用请以发布机关原文为准。</p>
    <p>监测程序每日检查公开来源，新发现文件仍需完成人工核验后才会进入目录数据。</p>
  </footer>
  <div id="detailModal" class="modal-backdrop" hidden>
    <div class="detail-modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div id="modalBody"></div>
    </div>
  </div>
  <script>
    const state = { policies: [], candidates: [], candidateReview: null, activePolicyId: null, viewMode: 'formal' };
    const dataVersion = '20260831-4';
    const elements = {
      cards: document.querySelector('#cards'),
      empty: document.querySelector('#empty'),
      listWrap: document.querySelector('.list-wrap'),
      search: document.querySelector('#search'),
      controls: document.querySelector('.controls'),
      modeFormal: document.querySelector('#modeFormal'),
      modeCandidate: document.querySelector('#modeCandidate'),
      category: document.querySelector('#category'),
      region: document.querySelector('#region'),
      resultCount: document.querySelector('#resultCount'),
      lastRun: document.querySelector('#lastRun'),
      candidatePanel: document.querySelector('#candidatePanel'),
      candidateGuide: document.querySelector('#candidateGuide'),
      candidateActions: document.querySelector('#candidateActions'),
      candidateStats: document.querySelector('#candidateStats'),
      candidateCards: document.querySelector('#candidateCards'),
      candidateEmpty: document.querySelector('#candidateEmpty'),
      detailModal: document.querySelector('#detailModal'),
      modalBody: document.querySelector('#modalBody')
    };

    function textOrDash(value) {
      return value || '—';
    }

    function parseDateValue(value) {
      if (!value || typeof value !== 'string') return null;
      const normalized = value.trim().replace(/[./]/g, '-').replace(/年/g, '-').replace(/月/g, '-').replace(/日/g, '');
      const match = normalized.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (!match) return null;
      const [, year, month, day] = match;
      const date = new Date(Number(year), Number(month) - 1, Number(day));
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function startOfWeek(date) {
      const result = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const day = result.getDay();
      const delta = day === 0 ? -6 : 1 - day;
      result.setDate(result.getDate() + delta);
      result.setHours(0, 0, 0, 0);
      return result;
    }

    function isCurrentWeek(value) {
      const date = parseDateValue(value);
      if (!date) return false;
      const now = new Date();
      const weekStart = startOfWeek(now);
      const nextWeekStart = new Date(weekStart);
      nextWeekStart.setDate(nextWeekStart.getDate() + 7);
      return date >= weekStart && date < nextWeekStart;
    }

    function appendOptions(select, values) {
      [...new Set(values)].sort((a, b) => a.localeCompare(b, 'zh-CN')).forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.append(option);
      });
    }

    function buildSourceLink(item, className = 'source-link') {
      const link = document.createElement('a');
      link.href = item.source_url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.className = className;
      link.textContent = '官方原文';
      return link;
    }

    function buildActionLink(url, label, primary = false) {
      if (!url) return null;
      const link = document.createElement('a');
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.className = `action-link${primary ? ' primary' : ''}`;
      link.textContent = label;
      return link;
    }

    function buildField(label, value, className = 'subtle') {
      const block = document.createElement('section');
      block.className = 'field';
      const heading = document.createElement('p');
      heading.className = 'field-label';
      heading.textContent = label;
      const body = document.createElement('p');
      body.className = `field-value ${className}`.trim();
      if (value instanceof Node) body.append(value);
      else body.textContent = textOrDash(value);
      block.append(heading, body);
      return block;
    }

    function buildPolicyCard(item) {
      const card = document.createElement('article');
      card.className = 'policy-card';
      const head = document.createElement('div');
      head.className = 'policy-head';

      const textWrap = document.createElement('div');
      textWrap.className = 'policy-text';

      const meta = document.createElement('div');
      meta.className = 'policy-meta';
      if (isCurrentWeek(item.published_date)) {
        const newTag = document.createElement('span');
        newTag.className = 'new-badge';
        newTag.textContent = 'NEW';
        meta.append(newTag);
      }
      const idTag = document.createElement('span');
      idTag.className = 'policy-id';
      idTag.textContent = item.policy_id;
      meta.append(idTag);

      const title = document.createElement('div');
      title.className = 'title-main';
      title.textContent = item.title;

      textWrap.append(meta, title);

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'toggle-btn';
      button.dataset.policyId = item.policy_id;
      button.textContent = '查看速查';

      head.append(textWrap, button);
      const grid = document.createElement('div');
      grid.className = 'policy-grid';
      grid.append(
        buildField('发文机关', item.issuer),
        buildField('文号', item.document_no),
        buildField('发布日期', item.published_date),
        buildField('地区', item.region),
        buildField('主题', item.category),
        buildField('来源', buildSourceLink(item))
      );

      card.append(head, grid);
      return card;
    }

    function buildSummaryCard(label, value) {
      const block = document.createElement('div');
      block.className = 'summary-card';
      const strong = document.createElement('strong');
      strong.textContent = label;
      const span = document.createElement('span');
      span.textContent = textOrDash(value);
      block.append(strong, span);
      return block;
    }

    function buildStatusBadge(statusLabel, status) {
      const badge = document.createElement('span');
      badge.className = `status-badge status-${status}`;
      badge.textContent = statusLabel;
      return badge;
    }

    function renderModal() {
      const item = state.policies.find((policy) => policy.policy_id === state.activePolicyId);
      elements.modalBody.replaceChildren();
      if (!item) {
        elements.detailModal.hidden = true;
        document.body.classList.remove('modal-open');
        return;
      }

      const head = document.createElement('div');
      head.className = 'modal-head';

      const headText = document.createElement('div');
      const meta = document.createElement('div');
      meta.className = 'policy-meta';
      if (isCurrentWeek(item.published_date)) {
        const newTag = document.createElement('span');
        newTag.className = 'new-badge';
        newTag.textContent = 'NEW';
        meta.append(newTag);
      }
      const idTag = document.createElement('span');
      idTag.className = 'policy-id';
      idTag.textContent = item.policy_id;
      meta.append(idTag);

      const modalTitle = document.createElement('h2');
      modalTitle.id = 'detailTitle';
      modalTitle.className = 'modal-title';
      modalTitle.textContent = item.title;
      headText.append(meta, modalTitle);

      const closeButton = document.createElement('button');
      closeButton.type = 'button';
      closeButton.className = 'modal-close';
      closeButton.id = 'closeDetail';
      closeButton.setAttribute('aria-label', '关闭速查');
      closeButton.textContent = '×';
      head.append(headText, closeButton);

      const summary = document.createElement('div');
      summary.className = 'modal-summary';
      summary.append(
        buildSummaryCard('发文机关', item.issuer),
        buildSummaryCard('文号', item.document_no),
        buildSummaryCard('发布日期', item.published_date),
        buildSummaryCard('地区 / 主题', `${textOrDash(item.region)} / ${textOrDash(item.category)}`)
      );

      const panel = document.createElement('div');
      panel.className = 'details-panel';
      const grid = document.createElement('div');
      grid.className = 'detail-grid';

      const quotesBlock = document.createElement('section');
      quotesBlock.className = 'detail-block';
      const quotesTitle = document.createElement('h2');
      quotesTitle.textContent = '重要原文';
      const quotesList = document.createElement('ul');
      quotesList.className = 'quotes-list';
      const quotes = Array.isArray(item.important_quotes) && item.important_quotes.length ? item.important_quotes : ['无。'];
      quotes.forEach((quote) => {
        const quoteItem = document.createElement('li');
        quoteItem.textContent = quote;
        quotesList.append(quoteItem);
      });
      quotesBlock.append(quotesTitle, quotesList);

      const interpretationBlock = document.createElement('section');
      interpretationBlock.className = 'detail-block';
      const interpretationTitle = document.createElement('h2');
      interpretationTitle.textContent = '官方解读';
      const interpretationText = document.createElement('p');
      interpretationText.textContent = item.official_interpretation || '无。';
      interpretationBlock.append(interpretationTitle, interpretationText);

      if (item.official_interpretation_url) {
        const interpretationLink = document.createElement('a');
        interpretationLink.href = item.official_interpretation_url;
        interpretationLink.target = '_blank';
        interpretationLink.rel = 'noopener noreferrer';
        interpretationLink.className = 'detail-link';
        interpretationLink.textContent = '解读来源';
        interpretationBlock.append(interpretationLink);
      }

      const actions = document.createElement('div');
      actions.className = 'detail-actions';
      actions.append(buildSourceLink(item));
      quotesBlock.append(actions);

      grid.append(quotesBlock, interpretationBlock);
      panel.append(grid);
      elements.modalBody.append(head, summary, panel);
      elements.detailModal.hidden = false;
      document.body.classList.add('modal-open');
    }

    function buildCandidateCard(item, reviewMeta) {
      const card = document.createElement('article');
      card.className = 'candidate-card';

      const top = document.createElement('div');
      top.className = 'candidate-top';

      const textWrap = document.createElement('div');
      const meta = document.createElement('div');
      meta.className = 'policy-meta';
      if (isCurrentWeek(item.issue_date)) {
        const newTag = document.createElement('span');
        newTag.className = 'new-badge';
        newTag.textContent = 'NEW';
        meta.append(newTag);
      }
      meta.append(buildStatusBadge(item.status_label, item.status));
      const keyTag = document.createElement('span');
      keyTag.className = 'policy-id';
      keyTag.textContent = item.candidate_key;
      meta.append(keyTag);

      const title = document.createElement('div');
      title.className = 'candidate-title';
      title.textContent = item.title;
      textWrap.append(meta, title);

      const actions = document.createElement('div');
      actions.className = 'candidate-actions';
      [buildActionLink(item.source_url, '看原文', true), buildActionLink(item.draft_url, '看草稿'), buildActionLink(item.draft_edit_url, '改草稿'), buildActionLink(reviewMeta.status_edit_url, '去确认')].filter(Boolean).forEach((node) => actions.append(node));

      top.append(textWrap, actions);

      const grid = document.createElement('div');
      grid.className = 'candidate-grid';
      grid.append(
        buildField('发文机关', item.issuer),
        buildField('发布日期', item.issue_date),
        buildField('地区', item.region),
        buildField('来源栏目', item.source_label),
        buildField('建议分区', item.suggested_category_label),
        buildField('当前状态', item.status_label),
        buildField('JSON 搜索键', item.candidate_key),
        buildField('草稿路径', item.draft_path)
      );

      card.append(top, grid);

      if (item.review_note) {
        const note = document.createElement('div');
        note.className = 'candidate-note';
        note.textContent = `审核备注：${item.review_note}`;
        card.append(note);
      }

      return card;
    }

    function getShownCandidates() {
      const keyword = elements.search.value.trim().toLocaleLowerCase('zh-CN');
      return state.candidates.filter((item) => {
        const haystack = [
          item.candidate_key,
          item.title,
          item.issuer,
          item.region,
          item.source_label,
          item.suggested_category_label,
          item.status_label,
          item.draft_path,
          item.review_note
        ].join(' ').toLocaleLowerCase('zh-CN');
        return !keyword || haystack.includes(keyword);
      });
    }

    function renderCandidates(shownCandidates = getShownCandidates()) {
      const reviewMeta = state.candidateReview;
      if (!reviewMeta) {
        elements.candidatePanel.hidden = true;
        return;
      }

      elements.candidatePanel.hidden = false;
      elements.candidateGuide.textContent = '自动巡检发现、但尚未正式入库的候选条目。打开 GitHub 状态文件后，搜索卡片里的 JSON 搜索键，把 status 改成 confirmed 或 rejected；对应草稿 Markdown 已自动生成。';

      elements.candidateActions.replaceChildren();
      [buildActionLink(reviewMeta.status_edit_url, '打开状态文件', true), buildActionLink(reviewMeta.draft_tree_url, '打开草稿目录')].filter(Boolean).forEach((node) => elements.candidateActions.append(node));

      elements.candidateStats.replaceChildren(
        buildSummaryCard('候选总数', reviewMeta.candidate_count),
        buildSummaryCard('待确认', reviewMeta.status_counts.pending),
        buildSummaryCard('已确认待入库', reviewMeta.status_counts.confirmed),
        buildSummaryCard('已排除', reviewMeta.status_counts.rejected)
      );

      elements.candidateCards.replaceChildren();
      shownCandidates.forEach((item) => {
        elements.candidateCards.append(buildCandidateCard(item, reviewMeta));
      });
      elements.candidateEmpty.hidden = shownCandidates.length !== 0;
    }

    function getShownPolicies() {
      const keyword = elements.search.value.trim().toLocaleLowerCase('zh-CN');
      return state.policies.filter((item) => {
        const haystack = [item.policy_id, item.title, item.issuer, item.document_no, item.region, item.category].join(' ').toLocaleLowerCase('zh-CN');
        return (!keyword || haystack.includes(keyword)) &&
          (!elements.category.value || item.category === elements.category.value) &&
          (!elements.region.value || item.region === elements.region.value);
      });
    }

    function setViewMode(mode) {
      state.viewMode = mode;
      const candidateMode = mode === 'candidate';
      elements.modeFormal.classList.toggle('active', !candidateMode);
      elements.modeCandidate.classList.toggle('active', candidateMode);
      elements.modeFormal.setAttribute('aria-selected', String(!candidateMode));
      elements.modeCandidate.setAttribute('aria-selected', String(candidateMode));
      elements.controls.classList.toggle('candidate-mode', candidateMode);
      elements.category.disabled = candidateMode;
      elements.region.disabled = candidateMode;
      elements.search.placeholder = candidateMode
        ? '搜索候选编号、标题、部门、地区、来源栏目或草稿路径'
        : '搜索编号、政策名称、部门、文号或地区';
      render();
    }

    function render() {
      const candidateMode = state.viewMode === 'candidate';
      if (candidateMode) {
        const shownCandidates = getShownCandidates();
        elements.cards.replaceChildren();
        elements.listWrap.hidden = true;
        elements.empty.hidden = true;
        elements.resultCount.textContent = shownCandidates.length;
        renderCandidates(shownCandidates);
        state.activePolicyId = null;
        renderModal();
        return;
      }

      const shown = getShownPolicies();
      elements.listWrap.hidden = false;
      elements.cards.replaceChildren();
      shown.forEach((item) => {
        elements.cards.append(buildPolicyCard(item));
      });

      elements.resultCount.textContent = shown.length;
      elements.empty.hidden = shown.length !== 0;
      if (!shown.some((item) => item.policy_id === state.activePolicyId)) {
        state.activePolicyId = null;
      }
      elements.candidatePanel.hidden = true;
      renderModal();
    }

    function openPolicy(policyId) {
      state.activePolicyId = policyId;
      renderModal();
    }

    function closePolicy() {
      state.activePolicyId = null;
      renderModal();
    }

    Promise.all([
      fetch(`./data/policies.json?v=${dataVersion}`, { cache: 'no-store' }).then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      }),
      fetch(`./data/run.json?v=${dataVersion}`, { cache: 'no-store' }).then((response) => (response.ok ? response.json() : null)).catch(() => null),
      fetch(`./data/candidate_review.json?v=${dataVersion}`, { cache: 'no-store' }).then((response) => (response.ok ? response.json() : null)).catch(() => null)
    ]).then(([data, runStatus, candidateReview]) => {
      state.policies = data.policies;
      state.candidateReview = candidateReview;
      state.candidates = candidateReview && Array.isArray(candidateReview.candidates) ? candidateReview.candidates : [];
      document.querySelector('#policyCount').textContent = data.policy_count;
      document.querySelector('#nationalCount').textContent = state.policies.filter((item) => item.region === '全国' || item.region === '国际').length;
      document.querySelector('#regionalCount').textContent = state.policies.filter((item) => item.region !== '全国' && item.region !== '国际').length;
      document.querySelector('#healthCount').textContent = state.policies.filter((item) => /卫生健康|卫健委/.test(item.issuer)).length;
      appendOptions(elements.category, state.policies.map((item) => item.category));
      appendOptions(elements.region, state.policies.map((item) => item.region));
      if (runStatus && runStatus.generated_at) {
        const extra = Number.isFinite(runStatus.new_policy_count) && runStatus.new_policy_count > 0
          ? `；今日新增入库：${runStatus.new_policy_count} 项`
          : '';
        elements.lastRun.textContent = `最近巡检：${runStatus.generated_at}；目录数据更新时间：${data.generated_at}${extra}`;
      } else {
        elements.lastRun.textContent = `目录数据更新时间：${data.generated_at}`;
      }
      render();
    }).catch((error) => {
      elements.lastRun.textContent = '公开数据读取失败';
      elements.empty.hidden = false;
      elements.empty.textContent = `暂时无法加载：${error.message}`;
    });

    [elements.search, elements.category, elements.region].forEach((control) => control.addEventListener(control.tagName === 'INPUT' ? 'input' : 'change', render));
    elements.modeFormal.addEventListener('click', () => setViewMode('formal'));
    elements.modeCandidate.addEventListener('click', () => setViewMode('candidate'));
    document.querySelector('#reset').addEventListener('click', () => {
      elements.search.value = '';
      elements.category.value = '';
      elements.region.value = '';
      render();
    });
    document.querySelectorAll('[data-keyword]').forEach((button) => button.addEventListener('click', () => {
      elements.search.value = button.dataset.keyword;
      render();
    }));
    elements.cards.addEventListener('click', (event) => {
      const button = event.target.closest('[data-policy-id]');
      if (!button) return;
      openPolicy(button.dataset.policyId);
    });
    elements.detailModal.addEventListener('click', (event) => {
      if (event.target.id === 'closeDetail' || event.target === elements.detailModal) closePolicy();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && state.activePolicyId) closePolicy();
    });
  </script>
</body>
</html>
